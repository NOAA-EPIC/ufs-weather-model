name: Regression Resource Check

on:
  pull_request_target:
    types: 
      - opened
      - reopened 
      - labeled
      - unlabeled
      - synchronize
  push:

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env: 
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MACHINES: "acorn derecho gaeac6 hera hercules orion ursa wcoss2"
  #BASE_URL: https://api.github.com/repos/ufs-community/ufs-weather-model
  BASE_URL: https://api.github.com/repos/NOAA-EPIC/ufs-weather-model
  PR_NUM: ${{ github.event.number }}
  PNG_TOKEN: ${{ secrets.PNG_TOKEN }}

jobs:
  get-data:  
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install requests numpy matplotlib
          mkdir -p data
          mkdir -p plots
      - name: Cache machine stats
        id: cache-stats
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/data/stats.json
          key: hist-stats-${{ github.event.pull_request.base.sha }} # If develop gets updated, stats.json should, too
      - name: Set stats.json env var (if cache hit) and compare w/HEAD of develop 
        if: steps.cache-stats.outputs.cache-hit == 'true'
        run: |
          echo "TEST_STATS=${{ github.workspace }}/data/stats.json" >> $GITHUB_ENV
          python -m tests-dev.scripts.get_data
        env: 
          TEST_STATS: ${{ github.workspace }}/data/stats.json
      - name: Get historical data and compare w/HEAD of develop
        if: steps.cache-stats.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          mkdir -p plots
          echo $PR_NUM
          python -m tests-dev.scripts.get_data
          ls -R ${{ github.workspace }}/plots
      - name: Upload json
        uses: actions/upload-artifact@v4
        with: 
          name: data
          path: ${{ github.workspace }}/data
      - name: Upload json
        uses: actions/upload-artifact@v4
        with: 
          name: plots
          path: ${{ github.workspace }}/plots
  wiki-push:
    runs-on: ubuntu-latest
    needs: get-data
    if: github.event.label.name == 'update-wiki-pngs'
    steps:
      - name: Download plots
        if: env.PR_NUM != ''
        uses: actions/download-artifact@v5
        with: 
          name: plots
          path: plots # ${{ github.workspace }}/plots
      - name: Clone wiki
        uses: actions/checkout@v4
        with:
          repository: NOAA-EPIC/ufs-weather-model.wiki #${{ github.repository }}.wiki 
          path: wm-wiki 
          token: ${{ secrets.PNG_TOKEN }} 
      - name: Copy plots to wiki
        if: env.PR_NUM != ''
        run: |
          cd wm-wiki
          if [[ ! -d "plots" ]]; then
            mkdir -p plots
          fi
          echo $PR_NUM
          cd plots
          cp ${{ github.workspace }}/plots/* .
      - name: Push images to wiki
        run: |
          
          cd wm-wiki

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote -v

          git add .
          echo "added plots to wm-wiki"
          
          status=`git status -s`

          if [ -z "${status}" ]; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-add plots to wiki"
            git push origin master
          fi
  write-results:  
    runs-on: ubuntu-latest
    needs: get-data
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install pandas mdutils numpy matplotlib
      - name: Download test results
        uses: actions/download-artifact@v5
        with: 
          name: data
          path: ${{ github.workspace }}/data
      - name: Write results summary
        run: |
          python -m tests-dev.scripts.write_test_summary
        env: 
          RUNTIME_RESULTS: ${{ github.workspace }}/data/runtime_results.json
          MEMORY_RESULTS: ${{ github.workspace }}/data/memory_results.json
