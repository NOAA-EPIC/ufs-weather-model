name: Regression Resource Check

on:
  pull_request:
    #branches: [develop]
    branches: ['**']
  push:
    branches: ['**']

permissions:
  contents: write

defaults:
  run:
    shell: bash -eo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env: 
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MACHINES: "acorn derecho gaeac6 hera hercules orion ursa wcoss2"
  #BASE_URL: https://api.github.com/repos/ufs-community/ufs-weather-model
  BASE_URL: https://api.github.com/repos/NOAA-EPIC/ufs-weather-model
  PR_NUM: ${{ github.event.number }}
  PNG_TOKEN: ${{ secrets.PNG_TOKEN }}

jobs:
  get-data:  
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install requests numpy matplotlib
          mkdir -p data
          mkdir -p plots
      - name: Cache machine stats
        id: cache-stats
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/data/stats.json
          key: hist-stats-${{ github.event.pull_request.base.sha }} # If develop gets updated, stats.json should, too
      - name: Set stats.json env var (if cache hit) and compare w/HEAD of develop 
        if: steps.cache-stats.outputs.cache-hit == 'true'
        run: |
          echo "TEST_STATS=${{ github.workspace }}/data/stats.json" >> $GITHUB_ENV
          python -m tests-dev.scripts.get_data 
        env: 
          TEST_STATS: ${{ github.workspace }}/data/stats.json
      - name: Get historical data and compare w/HEAD of develop
        if: steps.cache-stats.outputs.cache-hit != 'true'
        run: |
          mkdir -p data
          mkdir -p plots
          echo $PR_NUM
          python -m tests-dev.scripts.get_data
          ls -R ${{ github.workspace }}/plots
      - name: Upload json
        uses: actions/upload-artifact@v4
        with: 
          name: data
          path: ${{ github.workspace }}/data
      - name: Push images to wiki
        run: |
          
          git clone "https://${{ secrets.PNG_TOKEN }}@github.com/gspetro-NOAA/ufs-weather-model.wiki.git" wm-wiki

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          cd wm-wiki
          if [[ ! -d "plots" ]]; then
            mkdir -p plots
          fi
          cd plots
          cp ${{ github.workspace }}/plots/* .

          git remote -v

          git branch

          git add .
          echo "added plots"
          
          git status -s
          status=`git status -s`

          # git remote set-url origin https://github.com/gspetro-NOAA/ufs-weather-model.wiki.git

          if [ -z "${status}" ]; then
            echo "Nothing to commit."
          else
            git commit -m "Auto-add plots to wiki"
            git push origin master
          fi
          
          # git push origin HEAD:${GITHUB_REF#refs/heads/}
        
        env:
          PNG_TOKEN: S{{ secrets.PNG_TOKEN }}
  write-results:  
    runs-on: ubuntu-latest
    needs: get-data
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install pandas mdutils numpy matplotlib
      - name: Download test results
        uses: actions/download-artifact@v5
        with: 
          name: data
          path: ${{ github.workspace }}/data
      - name: Write results summary
        run: |
          python -m tests-dev.scripts.write_test_summary
        env: 
          RUNTIME_RESULTS: ${{ github.workspace }}/data/runtime_results.json
          MEMORY_RESULTS: ${{ github.workspace }}/data/memory_results.json
